name: Package release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
            artifact: windows-x64
          - name: Windows ARM64
            runner: windows-11-arm
            platform: win32
            arch: arm64
            artifact: windows-arm64
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact: linux-arm64
          - name: macOS Apple Silicon
            runner: macos-15
            platform: darwin
            arch: arm64
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: darwin
            arch: x64
            artifact: macos-x64
    env:
      STOIX_RELEASE_PLATFORM: ${{ matrix.platform }}
      STOIX_RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build, verify, package, and smoke
        run: npm run package:release

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: stoix-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
            artifacts/release/*.sha256

  draft-release:
    name: Create draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Create draft release with all platform assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --generate-notes
          --title "Stoix $TAG"
          release-assets/*
